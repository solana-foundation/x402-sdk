name: CI

on:
  push:
  pull_request:

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Rust tests
        run: cargo test
        working-directory: rust

  typescript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: pnpm/action-setup@v4
        with:
          version: 10.14.0
      - name: Install TypeScript workspace
        run: pnpm install
        working-directory: typescript
      - name: Build TypeScript package
        run: pnpm --filter @solana/x402 build
        working-directory: typescript
      - name: Test TypeScript package
        run: pnpm --filter @solana/x402 test:coverage
        working-directory: typescript

  php:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          extensions: gmp
          coverage: xdebug
      - name: Test PHP package
        run: |
          composer test
          X402_PHP_COVERAGE_MIN=90 composer coverage
        working-directory: php

  interop:
    runs-on: ubuntu-latest
    needs:
      - rust
      - typescript
      - php
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          extensions: gmp
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: pnpm/action-setup@v4
        with:
          version: 10.14.0
      - name: Install TypeScript workspace
        run: pnpm install
        working-directory: typescript
      - name: Build TypeScript package
        run: pnpm --filter @solana/x402 build
        working-directory: typescript
      - name: Build Rust interop adapters
        run: cargo build --bin interop_client --bin interop_server
        working-directory: rust
      - name: Install interop harness
        run: pnpm install
        working-directory: tests/interop
      - name: Typecheck interop harness
        run: pnpm typecheck
        working-directory: tests/interop
      - name: Run reference-spine interop smoke
        run: pnpm test:smoke
        working-directory: tests/interop
        env:
          X402_INTEROP_PROFILE: reference-spine
          X402_INTEROP_REFERENCE: rust
      - name: Run PHP exact server interop smoke
        run: pnpm test:smoke
        working-directory: tests/interop
        env:
          X402_INTEROP_CLIENTS: typescript,rust
          X402_INTEROP_SERVERS: php
          X402_INTEROP_PROFILE: full
