name: CI

on:
  push:
  pull_request:

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Rust tests
        run: cargo test
        working-directory: rust

  typescript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: pnpm/action-setup@v4
        with:
          version: 10.14.0
      - name: Install TypeScript workspace
        run: pnpm install
        working-directory: typescript
      - name: Build TypeScript package
        run: pnpm --filter @solana/x402 build
        working-directory: typescript
      - name: Test TypeScript package
        run: pnpm --filter @solana/x402 test:coverage
        working-directory: typescript

  kotlin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 9.5.1
      - name: Test Kotlin package
        run: gradle test
        working-directory: kotlin

  interop:
    runs-on: ubuntu-latest
    needs:
      - rust
      - typescript
      - kotlin
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 9.5.1
      - uses: pnpm/action-setup@v4
        with:
          version: 10.14.0
      - name: Install TypeScript workspace
        run: pnpm install
        working-directory: typescript
      - name: Build TypeScript package
        run: pnpm --filter @solana/x402 build
        working-directory: typescript
      - name: Build Rust interop adapters
        run: cargo build --bin interop_client --bin interop_server
        working-directory: rust
      - name: Build Kotlin interop client
        run: gradle --project-dir kotlin classes
      - name: Install interop harness
        run: pnpm install
        working-directory: tests/interop
      - name: Typecheck interop harness
        run: pnpm typecheck
        working-directory: tests/interop
      - name: Run reference-spine interop smoke
        run: pnpm test:smoke
        working-directory: tests/interop
        env:
          X402_INTEROP_PROFILE: reference-spine
          X402_INTEROP_REFERENCE: rust
      - name: Run Kotlin exact interop smoke
        run: pnpm test:smoke
        working-directory: tests/interop
        env:
          X402_INTEROP_CLIENTS: kotlin
          X402_INTEROP_SERVERS: rust,typescript
          X402_INTEROP_PROFILE: full
