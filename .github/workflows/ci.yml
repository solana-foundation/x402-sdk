name: CI

on:
  push:
  pull_request:

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Rust tests
        run: cargo test
        working-directory: rust

  typescript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: pnpm/action-setup@v4
        with:
          version: 10.14.0
      - name: Install TypeScript workspace
        run: pnpm install
        working-directory: typescript
      - name: Build TypeScript package
        run: pnpm --filter @solana/x402 build
        working-directory: typescript
      - name: Test TypeScript package
        run: pnpm --filter @solana/x402 test:coverage
        working-directory: typescript

  interop:
    runs-on: ubuntu-latest
    needs:
      - rust
      - typescript
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: leafo/gh-actions-lua@v11
        with:
          luaVersion: "5.4"
      - uses: leafo/gh-actions-luarocks@v5
      - name: Install Lua native libraries
        run: sudo apt-get update && sudo apt-get install -y libsodium-dev libssl-dev
      - uses: pnpm/action-setup@v4
        with:
          version: 10.14.0
      - name: Install TypeScript workspace
        run: pnpm install
        working-directory: typescript
      - name: Build TypeScript package
        run: pnpm --filter @solana/x402 build
        working-directory: typescript
      - name: Build Rust interop adapters
        run: cargo build --bin interop_client --bin interop_server
        working-directory: rust
      - name: Install interop harness
        run: pnpm install
        working-directory: tests/interop
      - name: Install Lua exact server dependencies
        run: luarocks make --tree .luarocks-tree lua/x402-sdk-svm-0.0.0-1.rockspec
      - name: Typecheck interop harness
        run: pnpm typecheck
        working-directory: tests/interop
      - name: Run optional Lua exact server static probe
        run: pnpm test:probe:lua-static
        working-directory: tests/interop
      - name: Run optional Lua syntax probe
        run: pnpm test:probe:lua-syntax
        working-directory: tests/interop
        env:
          LUA_PATH: ${{ github.workspace }}/.luarocks-tree/share/lua/5.4/?.lua;${{ github.workspace }}/.luarocks-tree/share/lua/5.4/?/init.lua;;
          LUA_CPATH: ${{ github.workspace }}/.luarocks-tree/lib/lua/5.4/?.so;;
      - name: Run Lua exact server interop smoke
        run: pnpm test:probe:lua-server
        working-directory: tests/interop
        env:
          LUA_PATH: ${{ github.workspace }}/.luarocks-tree/share/lua/5.4/?.lua;${{ github.workspace }}/.luarocks-tree/share/lua/5.4/?/init.lua;;
          LUA_CPATH: ${{ github.workspace }}/.luarocks-tree/lib/lua/5.4/?.so;;
      - name: Run reference-spine interop smoke
        run: pnpm test:smoke
        working-directory: tests/interop
        env:
          X402_INTEROP_PROFILE: reference-spine
          X402_INTEROP_REFERENCE: rust
