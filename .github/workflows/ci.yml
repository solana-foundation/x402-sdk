name: CI

on:
  push:
  pull_request:

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Rust tests
        run: cargo test
        working-directory: rust

  typescript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: pnpm/action-setup@v4
        with:
          version: 10.14.0
      - name: Install TypeScript workspace
        run: pnpm install
        working-directory: typescript
      - name: Build TypeScript package
        run: pnpm --filter @solana/x402 build
        working-directory: typescript
      - name: Test TypeScript package
        run: pnpm --filter @solana/x402 test:coverage
        working-directory: typescript

  interop:
    runs-on: ubuntu-latest
    needs:
      - rust
      - typescript
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: pnpm/action-setup@v4
        with:
          version: 10.14.0
      - name: Install TypeScript workspace
        run: pnpm install
        working-directory: typescript
      - name: Build TypeScript package
        run: pnpm --filter @solana/x402 build
        working-directory: typescript
      - name: Build Rust interop adapters
        run: cargo build --bin interop_client --bin interop_server
        working-directory: rust
      - name: Install interop harness
        run: pnpm install
        working-directory: tests/interop
      - name: Typecheck interop harness
        run: pnpm typecheck
        working-directory: tests/interop
      - name: Run upto readiness boundary tests
        run: pnpm test:upto-readiness
        working-directory: tests/interop
      - name: Print upto readiness report
        run: pnpm upto:readiness
        working-directory: tests/interop
      - name: Run batch-settlement readiness gate
        run: pnpm test:batch-readiness
        working-directory: tests/interop
      - name: Print batch-settlement readiness report
        run: pnpm batch:readiness
        working-directory: tests/interop
      - name: Run reference-spine interop smoke
        run: pnpm test:smoke
        working-directory: tests/interop
        env:
          X402_INTEROP_PROFILE: reference-spine
          X402_INTEROP_REFERENCE: rust
