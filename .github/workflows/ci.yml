name: CI

on:
  push:
  pull_request:

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Rust tests
        run: cargo test
        working-directory: rust

  typescript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: pnpm/action-setup@v4
        with:
          version: 10.14.0
      - name: Install TypeScript workspace
        run: pnpm install
        working-directory: typescript
      - name: Build TypeScript package
        run: pnpm --filter @solana/x402 build
        working-directory: typescript
      - name: Test TypeScript package
        run: pnpm --filter @solana/x402 test:coverage
        working-directory: typescript

  interop:
    runs-on: ubuntu-latest
    needs:
      - rust
      - typescript
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: pnpm/action-setup@v4
        with:
          version: 10.14.0
      - name: Install TypeScript workspace
        run: pnpm install
        working-directory: typescript
      - name: Build TypeScript package
        run: pnpm --filter @solana/x402 build
        working-directory: typescript
      - name: Build Rust interop adapters
        run: cargo build --bin interop_client --bin interop_server
        working-directory: rust
      - name: Install Python interop adapter
        run: |
          python -m pip install -e .
          python -m pip install coverage
        working-directory: python
      - name: Test Python interop adapter
        run: |
          python -m compileall -q src tests
          PYTHONPATH=src python -m coverage run -m unittest discover -s tests
          python -m coverage report --fail-under=90
        working-directory: python
      - name: Install interop harness
        run: pnpm install
        working-directory: tests/interop
      - name: Typecheck interop harness
        run: pnpm typecheck
        working-directory: tests/interop
      - name: Run reference-spine interop smoke
        run: pnpm test:smoke
        working-directory: tests/interop
        env:
          X402_INTEROP_PROFILE: reference-spine
          X402_INTEROP_REFERENCE: rust
      - name: Run Python client against Rust server
        run: pnpm test:probe:python-client
        working-directory: tests/interop
      - name: Run TypeScript client against Python server
        run: pnpm test:probe:python-server
        working-directory: tests/interop
