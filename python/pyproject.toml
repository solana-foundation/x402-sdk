[project]
name = "x402-sdk-svm"
version = "0.0.0"
description = "Experimental Python scaffold for Solana x402 interop adapters"
requires-python = ">=3.11"
dependencies = [
    "solana>=0.36,<0.37",
    "solders>=0.27,<0.28",
]

[tool.pytest.ini_options]
pythonpath = ["src"]

[tool.coverage.run]
branch = true
source = ["x402_sdk"]

[tool.coverage.report]
show_missing = true
skip_covered = true
